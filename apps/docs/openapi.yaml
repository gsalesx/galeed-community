        - principalToken: []
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/BrainRequiredTenant"
        - name: q
          in: query
          required: true
          description: A pergunta/consulta.
          schema:
            type: string
        - name: k
          in: query
          required: false
          description: Top-k de hits (default 6).
          schema:
            type: integer
            minimum: 1
            default: 6
        - $ref: "#/components/parameters/PrincipalQuery"
      responses:
        "200":
          description: Hits com selo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HitWithSelo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
