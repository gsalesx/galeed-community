                  $ref: "#/components/schemas/AccessLogEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/rbac/principal:
    delete:
      tags: [RBAC]
      summary: Remover principal de vez
      description: >-
        Remove o principal e todos os seus grants e tokens do brain; a pessoa perde a membership.
        O dono (owner) não pode ser removido. Parâmetro `id` via query string.
      parameters:
        - $ref: "#/components/parameters/BrainRequired"
        - name: id
          in: query
          required: true
          description: Id do principal a remover.
          schema:
            type: string
      responses:
        "200":
          description: Principal removido
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/rbac/token/rotate:
    post:
      tags: [RBAC]
      summary: Rotacionar token de principal
      description: >-
        Revoga o token ativo do principal e emite um novo token CRU (formato `gal_<hex>`), devolvido
        UMA VEZ (apenas o SHA256 é persistido). Body `{ principalId }`. 404 se o principal não existe.
      parameters:
        - $ref: "#/components/parameters/BrainRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principalId]
              properties:
                principalId:
                  type: string
      responses:
        "200":
          description: Token rotacionado (novo token cru, 1×)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Novo token cru gal_… — aparece UMA VEZ.
                  principal:
                    $ref: "#/components/schemas/Principal"
                  warning:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/stats:
    get:
      tags: [Leitura]
      summary: Estatísticas do brain
      description: >-
        Contagens do brain. No BFF (dono): pages/facts/edges/vectors. Na API read-only com token de
        principal: stats sob escopo (pages/facts/edges + scoped:true; vectors omitido).
      security:
        - cookieAuth: []
        - principalToken: []
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/BrainRequiredTenant"
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Stats"
                  - $ref: "#/components/schemas/ScopedStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/graph:
    get:
      tags: [Leitura]
      summary: Grafo do brain
      description: >-
        Grafo de entidades (nós + arestas). No BFF é o entityGraph (`?asOf=` ecoa no payload; o recorte
        temporal é feito no cliente). Na API read-only é graphAll, escopado quando há token de principal.
      security:
        - cookieAuth: []
        - principalToken: []
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/BrainRequiredTenant"
        - name: asOf
          in: query
          required: false
          description: Data de recorte (ISO). No BFF ecoa em `asOf`; o filtro temporal é client-side.
          schema:
            type: string
      responses:
        "200":
          description: Grafo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/entity:
