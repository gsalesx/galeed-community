          schema:
            type: string
      responses:
        "200":
          description: Preview de acesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/rbac/log:
    get:
      tags: [RBAC]
      summary: Trilha de auditoria de acesso
      description: Últimas entradas do access-log do brain (quem consultou o quê, áreas tocadas, n_returned).
