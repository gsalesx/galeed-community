      summary: Busca (FTS)
      description: Busca full-text por termo, opcionalmente filtrada por `type`. Devolve hits com selo.
      security:
        - cookieAuth: []
        - principalToken: []
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/BrainRequiredTenant"
        - name: q
          in: query
          required: true
          description: Termo de busca.
          schema:
            type: string
        - name: k
          in: query
          required: false
          description: Top-k (default 8).
          schema:
            type: integer
            minimum: 1
            default: 8
        - name: type
          in: query
          required: false
          description: Filtra por tipo de página.
          schema:
            type: string
        - $ref: "#/components/parameters/PrincipalQuery"
      responses:
        "200":
          description: Hits com selo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HitWithSelo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/facts:
    get:
      tags: [Leitura]
      summary: Fatos por dimensão (bitemporal)
      description: >-
        Fatos tipados (FactItem) por dimensão, com recorte bitemporal opcional (`asOf`, `current`).
        Na API read-only com token de principal os fatos são filtrados pelo escopo da página-fonte.
      security:
        - cookieAuth: []
        - principalToken: []
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/BrainRequiredTenant"
        - name: dim
          in: query
          required: false
          description: Dimensão (default "decisions").
          schema:
            type: string
            default: decisions
        - name: type
          in: query
          required: false
          description: Filtra por tipo de página.
          schema:
            type: string
        - name: asOf
          in: query
          required: false
          description: Vigentes em DATA (valid_from ≤ DATA < valid_to).
          schema:
            type: string
        - name: current
          in: query
          required: false
          description: "1 = só fatos vigentes hoje (valid_to vazio)."
          schema:
            type: string
            enum: ["0", "1"]
        - name: k
          in: query
          required: false
          description: Limite de fatos.
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/PrincipalQuery"
      responses:
        "200":
          description: Fatos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FactItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/timeline:
    get:
      tags: [Leitura]
      summary: Linha do tempo de uma entidade
      description: >-
        Linha do tempo bitemporal de uma entidade (evolução por degrau), opcionalmente por predicado.
        Na API read-only com token de principal é filtrada pelo escopo da página-fonte.
      security:
        - cookieAuth: []
        - principalToken: []
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/BrainRequiredTenant"
        - name: entity
          in: query
          required: false
          description: Entidade.
          schema:
            type: string
        - name: pred
          in: query
          required: false
          description: Predicado a filtrar.
          schema:
            type: string
        - name: k
          in: query
          required: false
          description: Limite.
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/PrincipalQuery"
      responses:
        "200":
          description: Fatos da timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FactHit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/ask:
    get:
      tags: [Leitura]
      summary: Perguntar (síntese LLM ancorada)
      description: >-
        Síntese LLM enriquecida — devolve resposta + citations (com selo) + facts (série bitemporal) +
        gaps opcionais. Único endpoint caro do BFF. Só no BFF (não está na API read-only).
      parameters:
        - $ref: "#/components/parameters/BrainRequired"
        - name: q
          in: query
          required: true
          description: A pergunta.
          schema:
            type: string
        - name: k
          in: query
          required: false
          description: Top-k de evidência (default 8).
          schema:
            type: integer
            minimum: 1
            default: 8
      responses:
        "200":
          description: Resposta ancorada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/ask/stream:
    get:
      tags: [Leitura]
      summary: Perguntar (streaming SSE)
      description: >-
        Síntese streamada token-a-token via Server-Sent Events (`text/event-stream`). A auth/validação
        (401/403/400) vai como JSON ANTES de abrir o stream. Eventos: `data: { t }` (token),
        `event: done` (carga ancorada { citations, facts }), `event: error` ({ error }). Só no BFF.
      parameters:
        - $ref: "#/components/parameters/BrainRequired"
        - name: q
          in: query
          required: true
          description: A pergunta.
          schema:
            type: string
        - name: k
          in: query
          required: false
          description: Top-k (default 8).
          schema:
            type: integer
            minimum: 1
            default: 8
      responses:
        "200":
          description: Stream SSE
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  Fluxo SSE. data com {"t":"<token>"} por token; event done com { citations, facts };
                  event error com { error }.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/source:
    get:
      tags: [Leitura]
      summary: Baixar o original verbatim (blob)
      description: >-
        Download binário do original verbatim de uma página, gateado pelo RBAC (M7). Sem `principal` =
        dono logado (admin do próprio brain). Com `principal` = agente escopado (só baixa o que vê → 403
        fora do escopo). Content-Type é o mime do blob; Content-Disposition inline. Só no BFF.
      parameters:
        - $ref: "#/components/parameters/BrainRequired"
        - name: slug
          in: query
          required: true
          description: Slug da página-fonte.
          schema:
            type: string
        - $ref: "#/components/parameters/PrincipalQuery"
      responses:
        "200":
          description: Binário do original
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/percepcoes:
    get:
      tags: [Leitura]
      summary: Percepções do cérebro (saída do sono)
      description: Percepções derivadas do sono (M24). Filtra por estado, paginação simples. Só no BFF.
      parameters:
        - $ref: "#/components/parameters/BrainRequired"
        - name: estado
          in: query
          required: false
          description: "viva (default) | stale | arquivada | todas."
          schema:
            type: string
            enum: [viva, stale, arquivada, todas]
            default: viva
        - name: k
          in: query
          required: false
          description: Limite (clampado 1..200, default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Deslocamento (≥0).
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Página de percepções
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PercepcoesPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/saude:
    get:
      tags: [Leitura]
      summary: Saúde interna do cérebro (sono, armazenamento, fila)
      description: >
        Estado REAL por dentro: último sono (rastro auditável de galeed_sono_state.last_trace —
        status, fases, falhas, candidatas à poda), contadores de armazenamento (páginas
        ativas/frias/arquivadas, vetores, fatos) e a fila de ingestão por status (inclui
        batch_*/error/dead). Leitura pura, zero LLM. Só no BFF.
      parameters:
        - $ref: "#/components/parameters/BrainRequired"
      responses:
        "200":
          description: "Saúde interna: { sono, storage, jobs }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  sono: { type: object, nullable: true }
                  storage: { type: object, nullable: true }
                  jobs: { type: object, additionalProperties: { type: integer } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/lixeira:
    get:
      tags: [Leitura]
      summary: Lixeira de páginas (arquivadas, reversível)
      description: >
        Páginas que o cérebro decidiu esquecer (archived=true). Nada é apagado — cada item pode
        ser restaurado via POST /api/lixeira/restaurar. Só no BFF.
      parameters:
        - $ref: "#/components/parameters/BrainRequired"
      responses:
        "200":
          description: "Página da lixeira: { items[], total }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        slug: { type: string }
                        type: { type: string }
                        title: { type: string }
                        date: { type: string }
                        tier: { type: string }
                  total: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/lixeira/restaurar:
    post:
      tags: [Leitura]
      summary: Restaura uma página da lixeira
      description: >
        Desarquiva/reaquece a página (cobre cold pós-shed E archived+hot pós-prune) e re-embeda
        o que faltar. restored=false quando o slug não existe ou a página já está ativa.
      parameters:
        - $ref: "#/components/parameters/BrainRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug: { type: string }
      responses:
        "200":
          description: "{ slug, restored, vectorsRebuilt }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  restored: { type: boolean }
                  vectorsRebuilt: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/cost:
    get:
      tags: [Leitura]
      summary: Rollup de custo de IA
      description: Custo real de IA do brain, com quebra por operação e por modelo. SÓ OWNER (403 senão).
      parameters:
        - $ref: "#/components/parameters/BrainRequired"
      responses:
        "200":
          description: Rollup de custo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostRollup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Custo é visível só pro dono do brain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: galeed_sess
      description: Cookie de sessão httpOnly (30 dias) do BFF. Setado por /auth/signup e /auth/login.
    principalToken:
      type: apiKey
      in: header
      name: x-galeed-principal-token
      description: >-
        Token de principal (formato gal_…) pra consumo via API read-only :8788. Alternativa por query:
        `?ptoken=`. Resolve o escopo (read) e escopa as leituras. Token inválido/revogado → 401.
    adminToken:
      type: apiKey
      in: header
      name: x-galeed-token
      description: >-
        Token admin da API read-only (== API_TOKEN do ambiente). Alternativa por query: `?token=`. Sem
        API_TOKEN configurado e sem token de principal → 503 (fail-closed).
    nangoSignature:
      type: apiKey
      in: header
      name: x-nango-signature
      description: Assinatura HMAC do webhook do Nango (m2m). Verificada contra NANGO_WEBHOOK_SECRET.
    ingestToken:
      type: apiKey
      in: header
      name: x-galeed-token
      description: >-
        Token do webhook de ingestão (== INGEST_TOKEN do ambiente) no ingest-server :8787.
        Sem INGEST_TOKEN configurado → 503 (fail-closed); token ausente/errado → 401. Mesmo nome de
        header do adminToken, mas serviço e segredo distintos (escrita vs. leitura).

  parameters:
    BrainRequired:
      name: brain
      in: query
      required: true
      description: >-
        Tenant (brain). Obrigatório nas rotas de tenant do BFF — ou vem em `?brain=` ou cai no
        currentBrain da sessão; valida membership (403 se não for membro).
      schema:
        type: string
    BrainRequiredTenant:
      name: brain
      in: query
      required: true
      description: >-
        Tenant (brain). No BFF resolve por `?brain=`/currentBrain (membership obrigatória). Na API
        read-only :8788, ausência cai no default GALEED_BRAIN.
      schema:
        type: string
    BrainOptional:
      name: brain
      in: query
      required: false
      description: Brain preferido pro currentBrain da sessão.
      schema:
        type: string
    SourceId:
      name: id
      in: path
      required: true
      description: Id (uuid) da fonte.
      schema:
        type: string
    HypothesisId:
      name: id
      in: path
      required: true
      description: Id (uuid) do item da fila de revisão.
      schema:
        type: string
    PrincipalQuery:
      name: principal
      in: query
      required: false
      description: Id de um principal escopado (opcional) — gateia a leitura/download pelo escopo dele.
      schema:
        type: string

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Sem sessão/token válidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Sem membership do brain ou bloqueado pelo RBAC
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: Método não permitido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflito (ex. gate de ancoragem reteve o claim, decisão concorrente)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Body acima do limite (25 MiB no BFF / 10 MB no webhook)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Erro inesperado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Config ausente (fail-closed) — sem chave/secret/API_TOKEN
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      description: Erro padrão — sempre um objeto com a chave error (mensagem legível).
      required: [error]
      properties:
        error:
          type: string

    Ok:
      type: object
      properties:
        ok:
          type: boolean

    Health:
      type: object
      properties:
        ok:
          type: boolean
        brain:
          type: string
          description: Presente só no /health do ingest-server.

    Account:
      type: object
      description: Conta (galeed_accounts). Cross-brain. Sem senha no shape de saída.
      required: [id, name, email]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string

    Brain:
      type: object
      description: Brain (tenant) + papel da conta logada nele.
      required: [id, name, role]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, member]

    Session:
      type: object
      description: Sessão do front — conta + brains + brain atual.
      required: [account, brains, currentBrain]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        brains:
          type: array
          items:
            $ref: "#/components/schemas/Brain"
        currentBrain:
          type: string

    SignupBody:
      type: object
      required: [email, password]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        brainName:
          type: string
          description: Se presente, cria a membership owner desse brain (guard anti-takeover).

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    Selo:
      type: object
      description: >-
        Selo epistêmico de um hit. O core emite `natureza`; o BFF preenche `tipo` (espelho de `natureza`)
        pro componente Seal do front.
      properties:
        status:
          type: string
          enum: [registrado, fato, hipotese, arquivado]
        natureza:
          type: string
        tipo:
          type: string
          description: Espelho de `natureza` adicionado pelo BFF (normHits). Pode estar ausente no core cru.
        fonte:
          type: string
        valid_from:
          type: string
        via:
          type: string
          enum: [vec, fts, grafo]
        cite:
          type: string
        tags:
          type: array
          items:
            type: string

    HitWithSelo:
      type: object
      description: Hit de recuperação (retrieve/search) com selo epistêmico.
      properties:
        slug:
          type: string
        type:
          type: string
        title:
          type: string
        date:
          type: string
        excerpt:
          type: string
        citation:
          type: string
        via:
          type: string
          enum: [vec, fts, grafo]
        score:
          type: number
        selo:
          $ref: "#/components/schemas/Selo"
        stage:
          type: object
          description: Só quando explain=true.
          properties:
            base:
              type: number
            recency:
              type: number
            salience:
              type: number
            final:
              type: number

    FactItem:
      type: object
      description: Fato tipado exposto pelo BFF (/api/facts e o `facts` do /api/ask). Não achata os tipados.
      properties:
        source_slug:
          type: string
        text:
          type: string
        entity:
          type: string
        predicate:
          type: string
        value:
          type: string
        value_num:
          type: [number, "null"]
        unit:
          type: string
        period:
          type: string
        tier:
          type: string
        valid_from:
          type: string
        valid_to:
          type: string
        status:
          type: string
        confidence:
          type: number

    FactHit:
      type: object
      description: Fato cru do engine (entity/timeline). Espelha FactHit.
      properties:
        source_slug:
          type: string
        type:
          type: string
        dimension:
          type: string
        text:
          type: string
        quote:
          type: string
        entity:
          type: string
        predicate:
          type: string
        value:
          type: string
        value_num:
          type: [number, "null"]
        unit:
          type: string
        period:
          type: string
        tier:
          type: string
        valid_from:
          type: string
        valid_to:
          type: string
        confidence:
          type: number
        status:
          type: string
        source_id:
          type: string

    AskResult:
      type: object
      description: Resposta do /api/ask — síntese + citations + facts + gaps.
      properties:
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/HitWithSelo"
        facts:
          type: array
          items:
            $ref: "#/components/schemas/FactItem"
        gaps:
          type: array
          items:
            type: string

    Stats:
      type: object
      description: Stats completas (BFF / API admin).
      properties:
        pages:
          type: integer
        facts:
          type: integer
        edges:
          type: integer
        vectors:
          type: integer

    ScopedStats:
      type: object
      description: Stats sob escopo (API read-only com token de principal). vectors omitido.
      properties:
        pages:
          type: integer
        facts:
          type: integer
        edges:
          type: integer
        scoped:
          type: boolean
          enum: [true]

    GraphNode:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
        date:
          type: string
        exists:
          type: boolean
        factCount:
          type: integer
        salience:
          type: number
        tier:
          type: string
        role:
          type: string

    GraphEdge:
      type: object
      properties:
        src:
          type: string
        dst:
          type: string
        kind:
          type: string
        weight:
          type: number

    GraphData:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
        asOf:
          type: string
          description: Ecoado pelo BFF quando `?asOf=` é passado.

    IngestInput:
      type: object
      description: Entrada do import via front. `kind` decide o caminho.
      required: [kind, type]
      properties:
        kind:
          type: string
          enum: [file, text]
        type:
          type: string
          description: Tipo declarado da página (ex. "call de venda").
        base64:
          type: string
          description: Conteúdo do arquivo (kind=file).
        filename:
          type: string
        contentType:
          type: string
        text:
          type: string
          description: Texto colado (kind=text).
        title:
          type: string
        date:
          type: string
          description: YYYY-MM-DD.
        sourceId:
          type: string
          description: Fonte (galeed_sources.id) sob cujo contrato o doc entra.

    EnqueueResult:
      type: object
      description: Ticket do enqueue (não é o resultado da ingestão).
      required: [jobId, status]
      properties:
        jobId:
          type: string
        status:
          $ref: "#/components/schemas/IngestJobStatus"

    IngestJobStatus:
      type: string
      enum:
        - queued
        - processing
        - findable
        - digesting
        - digested
        - batch_submitted
        - batch_harvesting
        - done
        - error
        - dead

    IngestJob:
      type: object
      description: Uma linha da fila de ingestão (galeed_ingest_jobs).
      properties:
        id:
          type: string
        brain:
          type: string
        kind:
          type: string
          enum: [file, text]
        status:
          $ref: "#/components/schemas/IngestJobStatus"
        type:
          type: string
        contentHash:
          type: [string, "null"]
        filename:
          type: [string, "null"]
        mime:
          type: [string, "null"]
        title:
          type: [string, "null"]
        jobDate:
          type: [string, "null"]
        textBody:
          type: [string, "null"]
        progress:
          type: number
        message:
          type: [string, "null"]
        resultJson:
          type: object
          additionalProperties: true
        errorMessage:
          type: [string, "null"]
        createdAt:
          type: string
        startedAt:
          type: [string, "null"]
        finishedAt:
          type: [string, "null"]
        batchId:
          type: [string, "null"]

    BrainContextInput:
      type: object
      description: Contexto editável do brain (sem version). Persistido por onboarding/context save.
      properties:
        self:
          type: object
          properties:
            slug:
              type: string
            label:
              type: string
            aliases:
              type: array
              items:
                type: string
        purpose:
          type: string
        roles:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [self, client, host, participant, other]
              speakers:
                type: array
                items:
                  type: string
              label:
                type: string
        sourceTypes:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              label:
                type: string
              otherRole:
                type: string

    ContextView:
      type: object
      description: Contexto traduzido pro front + version + cartão legível.
      properties:
        context:
          $ref: "#/components/schemas/BrainContextInput"
        version:
          type: integer
        card:
          type: string

    ReextractEstimate:
      type: object
      properties:
        staleDocs:
          type: integer
        totalDocs:
          type: integer
        costUsdEstimate:
          type: number

    ReextractResult:
      type: object
      properties:
        reextracted:
          type: integer
        blocked:
          type: integer
        derivedFacts:
          type: integer
        message:
          type: string

    SourceRecipeField:
      type: object
      required: [dimension, label, area]
      properties:
        dimension:
          type: string
          description: Chave da dimensão de extração (subconjunto das dims do extractable do tipo).
        label:
          type: string
        area:
          type: string
          description: Slug da área destino ("" = sem área).

    SourceRecipe:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/SourceRecipeField"
        guidance:
          type: string
        triage_profile:
          type: string

    SourceRow:
      type: object
      description: Uma fonte do brain. pages_count/facts_count são computados na leitura.
      properties:
        id:
          type: string
        name:
          type: string
        channel:
          type: string
          description: "v1: upload | paste."
        type:
          type: string
        recipe:
          $ref: "#/components/schemas/SourceRecipe"
        default_sensitivity:
          $ref: "#/components/schemas/SensitivityLevel"
        status:
          type: string
          enum: [ativa, pausada]
        last_read_at:
          type: [string, "null"]
        created_at:
          type: string
        pages_count:
          type: integer
        facts_count:
          type: integer

    CreateSourceBody:
      type: object
      required: [name, channel, type]
      properties:
        name:
          type: string
        channel:
          type: string
          enum: [upload, paste]
        type:
          type: string
        recipe:
          $ref: "#/components/schemas/SourceRecipe"
        defaultSensitivity:
          $ref: "#/components/schemas/SensitivityLevel"

    UpdateSourceBody:
      type: object
      description: PATCH semântico — só os campos presentes mudam.
      properties:
        name:
          type: string
        type:
          type: string
        recipe:
          $ref: "#/components/schemas/SourceRecipe"
        defaultSensitivity:
          $ref: "#/components/schemas/SensitivityLevel"

    ConnectorCreateResult:
      type: object
      properties:
        sourceId:
          type: string
        providerConfigKey:
          type: string
        name:
          type: string

    ConnectSessionResult:
      type: object
      properties:
        provider:
          type: string
        token:
          type: string
        connect_link:
          type: string
        expires_at:
          type: string

    SourceConnectionView:
      type: object
      properties:
        sourceId:
          type: string
        name:
          type: string
        channel:
          type: string
        providerConfigKey:
          type: string
        connectionId:
          type: string
        status:
          type: string
          enum: [desconectado, conectado, erro]
        cursor:
          type: string
        lastSyncAt:
          type: string
        lastError:
          type: string

    NangoWebhookBody:
      type: object
      description: Payload do webhook do Nango (auth | sync). Campos variam por tipo.
      properties:
        type:
          type: string
          enum: [auth, sync]
        operation:
          type: string
        success:
          type: boolean
        connectionId:
          type: string
        providerConfigKey:
          type: string
        syncName:
          type: string
        model:
          type: string
        modifiedAfter:
          type: string
        tags:
          type: object
          additionalProperties: true
      additionalProperties: true

    ReviewReason:
      type: string
      enum: [fora_da_receita, nao_ancorado, entidade_vaga, conexao_sugerida]

    ReviewStatus:
      type: string
      enum: [pendente, aprovada, descartada]

    HypothesisView:
      type: object
      description: Item da fila de revisão + nome da fonte + recomendação do juiz (opcional).
      properties:
        id:
          type: string
        source_id:
          type: string
        source_slug:
          type: string
        dimension:
          type: string
        text:
          type: string
        quote:
          type: string
        claim:
          description: Item cru da extração (jsonb).
        reason:
          $ref: "#/components/schemas/ReviewReason"
        status:
          $ref: "#/components/schemas/ReviewStatus"
        decided_by:
          type: string
        created_at:
          type: string
        decided_at:
          type: [string, "null"]
        source_name:
          type: string
        recomendacao:
          type: string
        recomendacao_motivo:
          type: string
        recomendacao_confianca:
          type: [number, "null"]
        recomendado_em:
          type: [string, "null"]

    HypothesisGroupView:
      type: object
      description: Grupo-decisão da fila (todos os pendentes que a mesma frase decide).
      properties:
        reason:
          $ref: "#/components/schemas/ReviewReason"
        dimension:
          type: string
        source_id:
