# Galeed — deploy Dokploy (atrás do Traefik).
# Sem publicar 80/443 no host (o Traefik do Dokploy roteia pro serviço `web:80`).
# Evolution NÃO sobe aqui — compose separado: docker-compose.evolution.dokploy.yml
# Uso no Dokploy: composePath = ./docker-compose.dokploy.yml

x-backend: &backend
  build:
    context: .
    dockerfile: apps/server/Dockerfile
  image: galeed-backend
  env_file: .env
  environment: &backend-env
    NODE_ENV: production
    DATABASE_URL: postgresql://galeed:galeed@db:5432/galeed?sslmode=disable
    GALEED_SCHEMA_PACK: /app/apps/server/schema-packs/a360.json
    GALEED_BLOB_DIR: /data/blobs
    EVOLUTION_API_URL: http://galeed-evolution:8080
    EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-galeed-local-evolution-key}
    EVOLUTION_WEBHOOK_BASE: http://galeed-gateway:8790
    GALEED_PROVIDER: ${GALEED_PROVIDER:-codex}
    GALEED_CLI_BACKEND: ${GALEED_CLI_BACKEND:-codex}
    GALEED_CODEX_MODEL: ${GALEED_CODEX_MODEL:-gpt-5.4-mini}
    CODEX_HOME: /root/.codex
    HOME: /root
  volumes:
    - galeed-blobs:/data/blobs
    # Tokens ChatGPT/Codex: Postgres galeed_llm_oauth (painel Conectar). Sem File Mount de auth.json.
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: galeed
      POSTGRES_PASSWORD: galeed
      POSTGRES_DB: galeed
    volumes:
      - galeed-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galeed -d galeed"]
      interval: 5s
      timeout: 3s
      retries: 10

  bff:
    <<: *backend
    command: ["npx", "tsx", "apps/server/src/connectors/web-server.ts"]
    environment:
      <<: *backend-env
      WEB_PORT: "8789"
      TRUST_PROXY: "1"
      SECURE_COOKIES: "${GALEED_SECURE_COOKIES:-1}"
    expose: ["8789"]
    networks:
      default: {}
      dokploy-network:
        aliases:
          - galeed-bff
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8789,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  gateway:
    <<: *backend
    command: ["npx", "tsx", "apps/server/src/connectors/gateway-server.ts"]
    environment:
      <<: *backend-env
      GATEWAY_PORT: "8790"
      TRUST_PROXY: "1"
    expose: ["8790"]
    networks:
      default: {}
      dokploy-network:
        aliases:
          - galeed-gateway
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8790,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  ingest-worker:
    <<: *backend
    command: ["npx", "tsx", "apps/server/src/connectors/ingest-worker.ts"]

  webhook-worker:
    <<: *backend
    command: ["npx", "tsx", "apps/server/src/connectors/webhook-worker.ts"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_DOCS_URL: ${VITE_DOCS_URL:-/docs}
    image: galeed-web
    environment:
      # TLS termina no Traefik; Caddy só HTTP interno
      GALEED_SITE_ADDRESS: ${GALEED_SITE_ADDRESS:-:80}
    expose: ["80"]
    depends_on:
      bff:
        condition: service_healthy
      gateway:
        condition: service_healthy
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  galeed-pgdata:
  galeed-blobs:
  caddy-data:
  caddy-config:

networks:
  dokploy-network:
    external: true
    name: dokploy-network
